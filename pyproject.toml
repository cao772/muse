[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "muse-gateway"
version = "0.1.0"
description = "Hardware-independent local gateway for Muse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
  "pyserial>=3.5,<4",
  "httpx2>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
muse-gateway = "gateway.__main__:main"
muse-voice = "gateway.voice:main"

[project.optional-dependencies]
stt = [
    "mlx-whisper>=0.4,<0.5 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
